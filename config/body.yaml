body:
  type: router
  description: >-
    Whole-body physiological organization across the represented systems.
  children:
    - blood
    - cardiovascular_system
    - renal_system
    - neuroendocrine_system

cardiovascular_system:
  type: router
  description: >-
    Cardiovascular physiology covering cardiac filling and pumping,
    blood flow, vascular tone, systemic vascular resistance, and mean arterial pressure.
  children:
    - heart
    - vasculature

renal_system:
  type: router
  description: >-
    Renal physiology covering kidney perfusion, filtration,
    urine production, and regulation of body fluid balance.
  children:
    - kidney

neuroendocrine_system:
  type: router
  description: >-
    Neural and hormonal regulation of cardiovascular and fluid homeostasis,
    represented by sympathetic, renin-angiotensin-aldosterone,
    and antidiuretic hormone systems.
  children:
    - sympathetic
    - raas
    - adh

blood:
  type: leaf
  description: >-
    The fluid compartment circulating through the vessels, carrying
    water and solutes around the body.
  knowledge: blood.md
  variables:
    - blood_volume
    - plasma_osmolality

heart:
  type: leaf
  description: >-
    Muscular pump that fills with the blood returning to it and ejects
    that blood into the arteries.
  knowledge: heart.md
  variables:
    - venous_return
    - cardiac_filling
    - stroke_volume
    - heart_rate
    - contractility
    - cardiac_output

vasculature:
  type: leaf
  description: >-
    Network of vessels carrying the blood ejected by the heart to the
    tissues, setting the resistance it meets and the pressure it develops.
  knowledge: vasculature.md
  variables:
    - vascular_tone
    - systemic_vascular_resistance
    - mean_arterial_pressure

kidney:
  type: leaf
  description: >-
    Organ perfused by arterial blood that filters it, reabsorbs solute
    and water from the filtrate, and forms urine.
  knowledge: kidney.md
  variables:
    - renal_perfusion
    - GFR
    - sodium_reabsorption
    - urine_output
    - renin

sympathetic:
  type: leaf
  description: >-
    Sympathetic branch of the autonomic nervous system, the fast neural
    arm of circulatory control acting on the heart and the vessels.
  knowledge: sympathetic.md
  variables:
    - sympathetic_activity

raas:
  type: leaf
  description: >-
    Endocrine cascade producing angiotensin II and aldosterone, the slow
    hormonal arm of circulatory and fluid control.
  knowledge: raas.md
  variables:
    - angiotensin_II
    - aldosterone

adh:
  type: leaf
  description: >-
    Hypothalamic-pituitary system secreting antidiuretic hormone, the
    hormone governing how much water the body conserves.
  knowledge: adh.md
  variables:
    - ADH
