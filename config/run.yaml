model:
  name: gemini-3.7-flash
  cache_system_prompts: false
  cache_ttl: "3600s"

generation:
  temperature: 0.0
  max_output_tokens: 1024

schema: config/schema_mvp.yaml

body:
  definition: config/domains/glucose.yaml
  knowledge: knowledge

routing:
  mode: rule_based

simulation:
  max_rounds: 10
  max_llm_calls: 40
  workers: 4

debug:
  verbose: true
  save_trace: true

output:
  directory: outputs/experiments/glucose_mvp
