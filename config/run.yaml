model:
  name: gemini-3.7-flash
  cache_system_prompts: false
  cache_ttl: "3600s"

generation:
  temperature: 0.0
  max_output_tokens: 4096

token_counting:
  encoding: o200k_base
  max_context_tokens: 200000

body:
  definition: config/bodies/body.yaml
  shared: config/bodies/blood.yaml
  knowledge: knowledge

optimization:
  max_agents: 6
  max_mutations: 10
  min_operations_per_mutation: 1
  max_operations_per_mutation: 3
  patience: 3
  rollouts_per_candidate: 1
  allow_cycles: true
  allow_self_edges: true

forward:
  max_rounds: 10
  max_llm_calls: 80
  workers: 1

debug:
  verbose: true

output:
  directory: outputs/experiments/graph_optimization
