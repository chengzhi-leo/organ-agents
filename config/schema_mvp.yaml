# Schema version: mvp-1.3-textbook-aligned

# Each physiological agent represents one local biological component and may emit
# only its own local outputs.
# Cross-agent routing is vocabulary-based: an event is delivered only to agents that
# declare that variable in inputs.
# Blood is a deterministic translator, not a reasoning agent.
# Blood receives events whose variable matches a transform source and emits the corresponding
# target variable with agent_id=blood.
# Scenario inputs use the same component, variable, and level vocabulary as responses.
# Internal mechanisms belong in agent knowledge, not in this API schema.

blood:
  outputs:
  - circulating_insulin
  - circulating_glucagon
  - blood_glucose
  transforms:
  - source: insulin_secretion
    target: circulating_insulin
    direction: same
  - source: glucagon_secretion
    target: circulating_glucagon
    direction: same
  - source: glucose_uptake
    target: blood_glucose
    direction: opposite
  - source: glucose_release
    target: blood_glucose
    direction: same
agents:
  pancreas:
    inputs:
    - blood_glucose
    outputs:
    - insulin_secretion
    - glucagon_secretion
  liver:
    inputs:
    - blood_glucose
    - circulating_insulin
    - circulating_glucagon
    - glycogenolysis
    outputs:
    - glucose_uptake
    - glucose_release
    - glycogenolysis
  skeletal_muscle:
    inputs:
    - blood_glucose
    - circulating_insulin
    outputs:
    - glucose_uptake
  kidney:
    inputs:
    - blood_glucose
    - glucose_reabsorption
    - water_reabsorption
    outputs:
    - glucose_reabsorption
    - urinary_glucose_excretion
    - water_reabsorption
    - urine_output
