model:
  name: gemini-3.7-flash
  cache_system_prompts: false
  cache_ttl: "3600s"

generation:
  temperature: 0.0
  max_output_tokens: 4096

agent:
  vocabulary_mode: constrained

vocabulary: config/vocabularies/glucose.yaml

body:
  definition: config/domains/glucose.yaml
  knowledge: knowledge

routing:
  mode: broadcast
  retries: 1

simulation:
  max_rounds: 6
  max_llm_calls: 24
  workers: 4

debug:
  verbose: false
  save_trace: true

output:
  directory: outputs/experiments/glucose_vocab
