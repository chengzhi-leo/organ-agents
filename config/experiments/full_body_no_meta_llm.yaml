model:
  name: gemini-3.7-flash
  cache_system_prompts: false
  cache_ttl: "3600s"

generation:
  temperature: 0.0
  max_output_tokens: 4096

token_counting:
  encoding: o200k_base
  max_context_tokens: 200000

body:
  definition: config/bodies/body.yaml
  shared: config/bodies/blood.yaml
  knowledge: knowledge

meta_agent:
  enabled: false

routing:
  mode: llm

simulation:
  max_rounds: 10
  max_llm_calls: 80
  workers: 1

debug:
  verbose: true
  save_trace: true

output:
  directory: outputs/experiments/full_body_comparison
  arm: no_meta_llm
