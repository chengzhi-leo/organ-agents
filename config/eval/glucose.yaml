detection:
  amplitude: 0.5

variables:
  blood_glucose:
    structure: '\|(Plasma|BloodCells|Interstitial|Endosome|EndosomalClearance)\|Glucose$'
    owners: [liver, skeletal_muscle]
    sign: 1
    threshold: {mode: relative, value: 0.05}
    aliases: [plasma_glucose, blood_glucose_concentration, glycemia]

  blood_insulin:
    structure: '\|(Plasma|BloodCells|Endosome|EndosomalClearance)\|Insulin( Ex)?$'
    owners: [pancreas]
    sign: 1
    threshold: {mode: relative, value: 0.05}
    aliases: [plasma_insulin, circulating_insulin]

  blood_glucagon:
    structure: '\|(Plasma|BloodCells|Endosome|EndosomalClearance)\|Glucagon$'
    owners: [pancreas]
    sign: 1
    threshold: {mode: relative, value: 0.05}
    aliases: [plasma_glucagon, circulating_glucagon]

  insulin_secretion:
    owners: [pancreas]
    sign: 1
    threshold: {mode: relative, value: 0.05}
    aliases: [insulin_release, beta_cell_secretion]

  glucagon_secretion:
    owners: [pancreas]
    sign: 1
    threshold: {mode: relative, value: 0.05}
    aliases: [glucagon_release, alpha_cell_secretion]

  hepatic_glucose_uptake:
    owners: [liver]
    sign: 1
    threshold: {mode: relative, value: 0.05}
    aliases: [liver_glucose_uptake, hgu]

  hepatic_glucose_production:
    owners: [liver]
    sign: 1
    threshold: {mode: relative, value: 0.05}
    aliases: [liver_glucose_output, endogenous_glucose_production, hgp]

  hepatic_glycogen:
    structure: '\|Liver\|Intracellular\|Glycogen$'
    owners: [liver]
    sign: 1
    threshold: {mode: absolute, value: 10000}
    aliases: [liver_glycogen, glycogen_stores]

  muscle_glucose_uptake:
    owners: [skeletal_muscle]
    sign: 1
    threshold: {mode: relative, value: 0.05}
    aliases: [peripheral_glucose_uptake, skeletal_muscle_glucose_uptake]

out_of_scope:
  - muscle_glycogen
  - renal_glucose_clearance
