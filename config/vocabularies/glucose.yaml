levels:
  - increased
  - decreased

agents:
  blood:
    kind: translator_environment
    variables:
      - blood_glucose
      - circulating_insulin
      - circulating_glucagon
      - circulating_growth_hormone
      - circulating_catecholamines
      - circulating_acth
      - circulating_glucocorticoids
      - circulating_tsh
      - circulating_thyroid_hormones
      - circulating_fatty_acids
  pancreas:
    kind: llm_agent
    variables:
      - insulin_secretion
      - glucagon_secretion
  liver:
    kind: llm_agent
    variables:
      - glucose_uptake
      - glucose_release
      - glycogen_synthesis
      - glycogenolysis
      - gluconeogenesis
      - amino_acid_uptake
  skeletal_muscle:
    kind: llm_agent
    variables:
      - glucose_uptake
      - glucose_utilization
      - glycogenolysis
  adipose_tissue:
    kind: llm_agent
    variables:
      - glucose_to_fat_conversion
      - fatty_acid_release
      - triglyceride_breakdown
  kidney:
    kind: llm_agent
    variables:
      - glucose_reabsorption
      - urinary_glucose_excretion
      - water_reabsorption
      - urine_output
  hypothalamus:
    kind: llm_agent
    variables:
      - adrenal_medulla_neural_signal
      - acth_release_signal
  pituitary:
    kind: llm_agent
    variables:
      - acth_secretion
      - growth_hormone_secretion
      - tsh_secretion
  adrenal_medulla:
    kind: llm_agent
    variables:
      - catecholamine_secretion
  adrenal_cortex:
    kind: llm_agent
    variables:
      - glucocorticoid_secretion
  thyroid:
    kind: llm_agent
    variables:
      - thyroid_hormone_secretion
  systemic_tissues:
    kind: source_placeholder
    variables:
      - glucose_uptake
      - fatty_acid_utilization
      - glucose_utilization
      - glucose_oxidation
      - atp_production
      - metabolic_rate
  systemic_metabolism:
    kind: source_placeholder
    variables:
      - glucose_synthesis
      - gluconeogenesis
  environment:
    kind: input_only
    variables:
      - acute_stress
      - chronic_stress
