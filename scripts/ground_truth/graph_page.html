<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>__PAGE_TITLE__</title>
<style>
:root {
  --ground: #f6f7f6;
  --surface: #fff;
  --sunken: #eceeed;
  --ink: #141d1b;
  --muted: #5d6d69;
  --line: #d5dbd9;
  --accent: #0e6a5e;
  --accent-soft: #d9ebe7;
  --up: #a6452a;
  --up-soft: #f4e3dc;
  --down: #2b5e8c;
  --down-soft: #dde7f1;
}
@media (prefers-color-scheme: dark) {
  :root {
    --ground: #0f1513;
    --surface: #18201e;
    --sunken: #131a18;
    --ink: #e3eae7;
    --muted: #93a29e;
    --line: #2c3835;
    --accent: #48bca9;
    --accent-soft: #143630;
    --up: #e28c63;
    --up-soft: #3a221a;
    --down: #71a9d6;
    --down-soft: #17293a;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ink);
  font: 15px/1.6 system-ui, -apple-system, "Segoe UI", sans-serif;
}
.wrap { max-width: 1180px; margin: 0 auto; padding: 48px 24px 80px; display: flex; flex-direction: column; gap: 36px; }
code, .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; }

h1 { font-size: 30px; line-height: 1.2; margin: 0 0 10px; text-wrap: balance; }
header p { margin: 0; max-width: 66ch; color: var(--muted); }
.eyebrow { font-size: 11px; letter-spacing: 0.13em; text-transform: uppercase; color: var(--accent); margin: 0 0 12px; }
.rail { display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center; padding-top: 16px; border-top: 1px solid var(--line); margin-top: 20px; }
.stat b { display: block; font-size: 21px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.legend { border-top: none; padding-top: 12px; font-size: 12.5px; color: var(--muted); }
.chip { font-size: 11px; padding: 4px 7px; border-radius: 3px; border: 1px solid var(--line); }
.chip.up { color: var(--up); background: var(--up-soft); }
.chip.down { color: var(--down); background: var(--down-soft); }
.chip.input { color: var(--accent); background: var(--accent-soft); }

section.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; overflow: hidden; }
.panel-head { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 16px; padding: 16px 20px 14px; border-bottom: 1px solid var(--line); }
.panel-head h2 { font-size: 18px; margin: 0; flex: 1 1 320px; }
.sid { font-size: 11px; color: var(--accent); background: var(--accent-soft); padding: 5px 8px; border-radius: 3px; }
.meta { width: 100%; display: flex; flex-wrap: wrap; gap: 4px 18px; font-size: 11.5px; color: var(--muted); }
.canvas { overflow-x: auto; padding: 4px 0 8px; }
.canvas svg { display: block; height: auto; max-width: 100%; }

__GRAPH_STYLE__

.matrix-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: 4px; padding: 18px 20px 6px; overflow-x: auto; }
table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
th, td { padding: 7px 6px; border-bottom: 1px solid var(--line); text-align: center; font-variant-numeric: tabular-nums; }
th.agent, td.agent { text-align: left; font-family: ui-monospace, monospace; white-space: nowrap; padding-right: 16px; }
thead th { font-size: 11px; font-family: ui-monospace, monospace; color: var(--muted); border-bottom: 1px solid var(--ink); }
td.hit { color: var(--accent); font-weight: 600; }
td.miss { color: var(--line); }
tbody tr:hover { background: var(--sunken); }
h3 { font-size: 15px; margin: 0 0 4px; }
p.note { margin: 0 0 14px; font-size: 13px; color: var(--muted); max-width: 70ch; }
footer { font-size: 12.5px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="eyebrow">__EYEBROW__</p>
    <h1>__HEADING__</h1>
    <p>__DESCRIPTION__</p>
    <div class="rail">__RAIL__</div>
    <div class="rail legend">
      <span><span class="chip input">input</span> perturbation entering the body</span>
      <span><span class="chip up">variable &#9650;</span> increased</span>
      <span><span class="chip down">variable &#9660;</span> decreased</span>
    </div>
  </header>

  __PANELS__

  __MATRIX_SECTION__

  <footer>
    Generated from <code>__SOURCE__</code> by <code>scripts/ground_truth/visualize_gt.py</code>. __FOOTER__
  </footer>
</div>

</body>
</html>
